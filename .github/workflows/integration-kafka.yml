name: Integration (Kafka)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "test/**"

jobs:
  kafka-tests:
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      KAFKA_BROKERS: "localhost:19092"
      DATABASE_URL: ecto://postgres:postgres@localhost:5432/app_test

    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Point Dotenvy to CI env dir
        run: echo "DOTENVY_DIR=$GITHUB_WORKSPACE/ci_envs" >> $GITHUB_ENV

      - name: Start Redpanda (dev container mode)
        run: |
          docker run -d --name redpanda -p 19092:19092 \
            docker.redpanda.com/redpandadata/redpanda:v24.1.9 \
            redpanda start \
              --mode dev-container \
              --smp 1 --memory 1G --overprovisioned \
              --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
              --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
          # basic wait
          for i in {1..30}; do
            docker logs redpanda --since 5s | grep -qi "Started Kafka API server" && break || sleep 2
          done

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18.x"
          otp-version: "28"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            ~/.mix
            ~/.hex
          key: ${{ runner.os }}-beam-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}

      - run: mix deps.get --only test
      - run: mix ecto.create && mix ecto.migrate

      # e.g., only run tests tagged :kafka; change to your needs
      - run: mix test --include kafka --exclude test --slowest 10
